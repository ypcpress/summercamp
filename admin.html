<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#d4f20c">
<meta name="robots" content="noindex, nofollow">
<title>서머캠프 후기 · 운영진 확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans:ital,wght@0,400;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#CCFF00;
  --lime-deep:#c2e00a;
  --red:#fb2b06;
  --paper:#ffffff;
  --sans:'Noto Sans KR','Noto Sans',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sans-latin:'Noto Sans','Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --clip:polygon(
    46px 2px, calc(100% - 22px) 15px, 100% 86px, calc(100% - 3px) calc(100% - 104px),
    calc(100% - 58px) 100%, 52px calc(100% - 13px), 2px calc(100% - 74px), 7px 64px
  );
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* Author display rules outrank the UA stylesheet's [hidden], so any
   element given a display here would ignore the attribute without this. */
[hidden]{display:none !important;}
body{font-family:var(--sans);color:var(--red);background:var(--paper);line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased;}
#app{max-width:480px;margin:0 auto;position:relative;background:var(--paper);}
@media(min-width:520px){body{padding:20px 0;}#app{box-shadow:0 0 0 1px #f0f0f0;}}
.rule{height:0;border-top:1px solid var(--red);}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 12px;}
.brand{display:flex;flex-direction:column;line-height:1.15;cursor:pointer;}
.brand b{font-weight:900;font-size:14px;letter-spacing:-.01em;}
.brand span{font-family:var(--sans-latin);font-style:italic;font-weight:700;font-size:10px;opacity:.8;}

.view{padding:6px 7px 76px;}
.sheet{background:var(--lime);clip-path:var(--clip);padding:52px 22px 60px;min-height:560px;}
.pagetitle{text-align:center;font-weight:900;font-size:clamp(24px,7.5vw,31px);letter-spacing:-.02em;margin-bottom:6px;}
.para{font-size:14px;line-height:1.8;font-weight:500;margin:13px 0;}
.sectlabel{text-align:center;font-weight:900;font-size:15px;padding:10px 4px;}
.applybtn{display:flex;align-items:center;justify-content:center;gap:8px;width:fit-content;margin:22px auto 0;
  background:var(--red);color:var(--lime);border:2px solid var(--red);border-radius:100px;
  font-family:var(--sans);font-weight:800;font-size:15px;text-decoration:none;padding:13px 20px;cursor:pointer;}
.applybtn:hover{background:var(--lime);color:var(--red);}
.ghostbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--red);background:transparent;color:var(--red);
  font-family:var(--sans);font-weight:700;font-size:12.5px;border-radius:100px;padding:6px 14px;cursor:pointer;}
.ghostbtn:hover{background:var(--red);color:var(--lime);}

.banner{border:2px dashed var(--red);border-radius:12px;padding:11px 13px;margin:14px 0 0;font-size:12.5px;font-weight:700;line-height:1.6;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:16px 0 4px;}
.counts{font-size:12.5px;font-weight:700;}

.filters{display:flex;border:2px solid var(--red);border-radius:100px;overflow:hidden;margin:12px 0 0;}
.filterbtn{flex:1;border:none;background:var(--paper);color:var(--red);font-family:var(--sans);
  font-weight:700;font-size:12.5px;padding:9px 6px;cursor:pointer;line-height:1.3;}
.filterbtn.active{background:var(--red);color:var(--lime);}

.post{padding:18px 0;}
.shots{display:grid;gap:7px;}
.shots.multi{grid-template-columns:repeat(2,1fr);}
.shots img{display:block;width:100%;border:2px solid var(--red);background:var(--lime-deep);}
.shots.multi img{aspect-ratio:1;object-fit:cover;}
.shots .pending{display:flex;align-items:center;justify-content:center;aspect-ratio:3/2;
  border:2px dashed var(--red);font-size:12px;font-weight:700;opacity:.7;}
.post .body{font-size:14px;line-height:1.8;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px;}
.post .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;}
.post .who{font-weight:900;font-size:13px;}
.post .when{font-family:var(--sans-latin);font-weight:700;font-size:11px;opacity:.7;}
.badge{font-weight:700;font-size:11px;padding:1px 10px;border:2px solid var(--red);border-radius:100px;}
.badge.priv{background:var(--red);color:var(--lime);}
.empty{font-size:13.5px;font-weight:700;line-height:1.75;padding:26px 0;text-align:center;white-space:pre-line;}
.gate{text-align:center;padding:18px 0 6px;}
.gate .who{font-size:12.5px;font-weight:700;margin-top:12px;opacity:.85;word-break:break-all;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand" onclick="location.href='index.html'">
      <b>2026 서머캠프 — 섬과 다리</b>
      <span>Islands and Bridges · by Yellow Pen Club</span>
    </div>
    <button class="ghostbtn" id="signout" hidden>로그아웃</button>
  </div>
  <div class="rule" style="margin:0 7px;"></div>

  <section class="view">
    <div class="sheet">
      <div class="pagetitle">운영진 확인</div>
      <div class="rule"></div>
      <p class="para">‘운영진에게만’으로 올라온 후기를 포함해 전체를 볼 수 있는 페이지입니다.</p>

      <div id="banner" class="banner" hidden></div>

      <!-- sign-in gate -->
      <div class="gate" id="gate" hidden>
        <button class="applybtn" id="signin">구글 계정으로 로그인</button>
        <div class="who" id="gate-msg"></div>
      </div>

      <!-- content -->
      <div id="content" hidden>
        <div class="filters" id="filters">
          <button class="filterbtn active" data-f="all">전체</button>
          <button class="filterbtn" data-f="private">운영진에게만</button>
          <button class="filterbtn" data-f="public">공개</button>
        </div>
        <div class="toolbar">
          <span class="counts" id="counts"></span>
          <button class="ghostbtn" id="refresh">새로고침</button>
        </div>
        <div class="rule"></div>
        <div id="list"></div>
      </div>
    </div>
  </section>
</div>

<script type="module">
/* Keep these three in step with preview.html. */
const ADMIN_EMAIL = 'underbluecup@gmail.com';
const firebaseConfig = {
  apiKey: '',
  authDomain: '',
  projectId: '',
  storageBucket: '',
  messagingSenderId: '',
  appId: ''
};

const COLLECTION = 'reviews';
const PAGE_SIZE  = 200;
const CONFIGURED = !!firebaseConfig.projectId;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function normalise(v){
  const images = Array.isArray(v.images) ? v.images.filter(im => im && (im.url || im.path))
               : v.imageUrl ? [{url:v.imageUrl, path:v.imagePath || ''}]
               : [];
  return {
    id: v.id, name: v.name || '', message: v.message || '',
    images, isPublic: v.isPublic !== false, createdAt: v.createdAt
  };
}

function when(ms){
  const d = new Date(ms);
  return d.toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

/* ---------------- render ---------------- */
let posts = [], filter = 'all';

function visible(){
  return posts.filter(p => filter === 'all' ? true : filter === 'private' ? !p.isPublic : p.isPublic);
}

function render(){
  const rows = visible();
  const priv = posts.filter(p => !p.isPublic).length;
  $('counts').textContent = `전체 ${posts.length}개 · 운영진에게만 ${priv}개`;

  $('list').innerHTML = rows.length ? rows.map((p, i) => `
    ${i ? '<div class="rule"></div>' : ''}
    <div class="post">
      ${p.images.length ? `<div class="shots${p.images.length > 1 ? ' multi' : ''}">${
        p.images.map(im => im.url
          ? `<a href="${esc(im.url)}" target="_blank" rel="noopener"><img src="${esc(im.url)}" alt="" loading="lazy"></a>`
          : `<div class="pending">사진 불러오는 중…</div>`).join('')
      }</div>` : ''}
      ${p.message ? `<div class="body">${esc(p.message)}</div>` : ''}
      <div class="meta">
        <span class="who">${esc(p.name || '익명')}</span>
        <span class="when">${esc(when(p.createdAt))}</span>
        ${p.isPublic ? '<span class="badge">공개</span>' : '<span class="badge priv">운영진에게만</span>'}
      </div>
    </div>`).join('') : `<div class="empty">해당하는 후기가 없습니다.</div>`;
}

document.querySelectorAll('.filterbtn').forEach(b => {
  b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll('.filterbtn').forEach(x => x.classList.toggle('active', x === b));
    render();
  };
});

/* ---------------- demo mode ---------------- */
/* Without a Firebase project there is nothing to sign in to, so the page
   reads whatever preview.html left in this browser. It shows the layout
   and the public/private split without standing in for real access
   control — that lives in the Firestore and Storage rules. */
if (!CONFIGURED){
  $('banner').textContent = '데모 모드 — Firebase 설정 전이라 이 브라우저에 저장된 후기만 보여줍니다. 실제 로그인은 설정 후 동작합니다.';
  $('banner').hidden = false;
  $('content').hidden = false;
  try { posts = (JSON.parse(localStorage.getItem('summercamp-reviews-demo')) || []).map(normalise); }
  catch(e){ posts = []; }
  posts.sort((a,b) => b.createdAt - a.createdAt);
  render();
  $('refresh').onclick = () => location.reload();
} else {
  /* ---------------- firebase ---------------- */
  const V = 'https://www.gstatic.com/firebasejs/10.14.1';
  const [app, fsm, stm, authm] = await Promise.all([
    import(`${V}/firebase-app.js`),
    import(`${V}/firebase-firestore.js`),
    import(`${V}/firebase-storage.js`),
    import(`${V}/firebase-auth.js`)
  ]);
  const a    = app.initializeApp(firebaseConfig);
  const db   = fsm.getFirestore(a);
  const sg   = stm.getStorage(a);
  const auth = authm.getAuth(a);

  $('signin').onclick = async () => {
    try { await authm.signInWithPopup(auth, new authm.GoogleAuthProvider()); }
    catch(e){ $('gate-msg').textContent = '로그인하지 못했습니다: ' + e.message; }
  };
  $('signout').onclick = () => authm.signOut(auth);
  $('refresh').onclick = () => loadAll();

  async function loadAll(){
    /* No isPublic filter: the rules let this address read every post. */
    const snap = await fsm.getDocs(
      fsm.query(fsm.collection(db, COLLECTION), fsm.orderBy('createdAt', 'desc'), fsm.limit(PAGE_SIZE))
    );
    posts = snap.docs.map(d => normalise({
      ...d.data(), id: d.id,
      createdAt: d.data().createdAt?.toMillis ? d.data().createdAt.toMillis() : Date.now()
    }));
    render();

    /* Private photos are stored without a download URL; fetch one now
       that we are signed in, then repaint. */
    let changed = false;
    await Promise.all(posts.flatMap(p => p.images.map(async im => {
      if (im.url || !im.path) return;
      try { im.url = await stm.getDownloadURL(stm.ref(sg, im.path)); changed = true; }
      catch(e){ console.error('photo', im.path, e); }
    })));
    if (changed) render();
  }

  authm.onAuthStateChanged(auth, async user => {
    const ok = user && user.email === ADMIN_EMAIL;
    $('gate').hidden    = ok;
    $('content').hidden = !ok;
    $('signout').hidden = !user;

    if (!user){ $('gate-msg').textContent = ''; return; }
    if (!ok){
      $('gate-msg').textContent = `${user.email} 계정은 열람 권한이 없습니다. 운영진 계정으로 로그인해주세요.`;
      return;
    }
    try { await loadAll(); }
    catch(e){
      console.error(e);
      $('list').innerHTML = `<div class="empty">후기를 불러오지 못했습니다.\n보안 규칙이 적용되었는지 확인해주세요.</div>`;
    }
  });
}
</script>
</body>
</html>
