<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#d4f20c">
<meta name="robots" content="noindex, nofollow">
<title>서머캠프 후기 · 운영진 확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans:ital,wght@0,400;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#CCFF00;
  --lime-deep:#c2e00a;
  --red:#fb2b06;
  --paper:#ffffff;
  --sans:'Noto Sans KR','Noto Sans',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sans-latin:'Noto Sans','Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --clip:polygon(
    46px 2px, calc(100% - 22px) 15px, 100% 86px, calc(100% - 3px) calc(100% - 104px),
    calc(100% - 58px) 100%, 52px calc(100% - 13px), 2px calc(100% - 74px), 7px 64px
  );
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* Author display rules outrank the UA stylesheet's [hidden], so any
   element given a display here would ignore the attribute without this. */
[hidden]{display:none !important;}
body{font-family:var(--sans);color:var(--red);background:var(--paper);line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased;}
#app{max-width:480px;margin:0 auto;position:relative;background:var(--paper);}
@media(min-width:520px){body{padding:20px 0;}#app{box-shadow:0 0 0 1px #f0f0f0;}}
.rule{height:0;border-top:1px solid var(--red);}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 12px;}
.brand{display:flex;flex-direction:column;line-height:1.15;cursor:pointer;}
.brand b{font-weight:900;font-size:14px;letter-spacing:-.01em;}
.brand span{font-family:var(--sans-latin);font-style:italic;font-weight:700;font-size:10px;opacity:.8;}

.view{padding:6px 7px 76px;}
.sheet{background:var(--lime);clip-path:var(--clip);padding:52px 22px 60px;min-height:560px;}
.pagetitle{text-align:center;font-weight:900;font-size:clamp(24px,7.5vw,31px);letter-spacing:-.02em;margin-bottom:6px;}
.para{font-size:14px;line-height:1.8;font-weight:500;margin:13px 0;}
.applybtn{display:flex;align-items:center;justify-content:center;gap:8px;width:fit-content;margin:22px auto 0;
  background:var(--red);color:var(--lime);border:2px solid var(--red);border-radius:100px;
  font-family:var(--sans);font-weight:800;font-size:15px;text-decoration:none;padding:13px 20px;cursor:pointer;}
.applybtn:hover{background:var(--lime);color:var(--red);}
.applybtn:disabled{opacity:.4;cursor:default;}
.ghostbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--red);background:transparent;color:var(--red);
  font-family:var(--sans);font-weight:700;font-size:12.5px;border-radius:100px;padding:6px 14px;cursor:pointer;}
.ghostbtn:hover{background:var(--red);color:var(--lime);}

.banner{border:2px dashed var(--red);border-radius:12px;padding:11px 13px;margin:14px 0 0;font-size:12.5px;font-weight:700;line-height:1.6;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:16px 0 4px;}
.counts{font-size:12.5px;font-weight:700;}

.filters{display:flex;border:2px solid var(--red);border-radius:100px;overflow:hidden;margin:12px 0 0;}
.filterbtn{flex:1;border:none;background:var(--paper);color:var(--red);font-family:var(--sans);
  font-weight:700;font-size:12.5px;padding:9px 6px;cursor:pointer;line-height:1.3;}
.filterbtn.active{background:var(--red);color:var(--lime);}

.pwbox{width:100%;font-family:var(--sans);font-weight:500;font-size:15px;color:var(--red);
  background:var(--paper);border:2px solid var(--red);border-radius:10px;padding:11px 13px;text-align:center;}
.pwbox::placeholder{color:var(--red);opacity:.42;}
.pwbox:focus{outline:none;box-shadow:inset 0 0 0 2px var(--red);}

.post{padding:18px 0;}
.shots{display:grid;gap:7px;}
.shots.multi{grid-template-columns:repeat(2,1fr);}
.shots img,.shots video{display:block;width:100%;border:2px solid var(--red);background:var(--lime-deep);}
.shots.multi img,.shots.multi video{aspect-ratio:1;object-fit:cover;}
.origlink{display:block;text-align:center;font-size:11px;font-weight:700;color:var(--red);
  text-decoration:underline;text-underline-offset:2px;margin-top:5px;}
.post .body{font-size:14px;line-height:1.8;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px;}
.post .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;}
.post .who{font-weight:900;font-size:13px;}
.post .when{font-family:var(--sans-latin);font-weight:700;font-size:11px;opacity:.7;}
.badge{font-weight:700;font-size:11px;padding:1px 10px;border:2px solid var(--red);border-radius:100px;}
.badge.priv{background:var(--red);color:var(--lime);}
.delbtn{margin-left:auto;border:2px solid var(--red);background:transparent;color:var(--red);
  font-family:var(--sans);font-weight:700;font-size:11px;border-radius:100px;padding:3px 11px;cursor:pointer;}
.delbtn:hover{background:var(--red);color:var(--lime);}
.empty{font-size:13.5px;font-weight:700;line-height:1.75;padding:26px 0;text-align:center;white-space:pre-line;}
.gate{text-align:center;padding:8px 0 6px;}
.gate .msg{font-size:12.5px;font-weight:700;margin-top:14px;opacity:.85;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand" onclick="location.href='index.html'">
      <b>2026 서머캠프 — 섬과 다리</b>
      <span>Islands and Bridges · by Yellow Pen Club</span>
    </div>
    <button class="ghostbtn" id="signout" hidden>잠그기</button>
  </div>
  <div class="rule" style="margin:0 7px;"></div>

  <section class="view">
    <div class="sheet">
      <div class="pagetitle">운영진 확인</div>
      <div class="rule"></div>
      <p class="para">‘운영진에게만’으로 올라온 후기를 포함해 전체를 볼 수 있는 페이지입니다.</p>

      <div id="banner" class="banner" hidden></div>

      <!-- password gate -->
      <div class="gate" id="gate" hidden>
        <form id="pwform">
          <input class="pwbox" type="password" id="pw" placeholder="운영진 비밀번호" autocomplete="current-password">
          <button class="applybtn" type="submit" id="pwgo">확인</button>
        </form>
        <div class="msg" id="gate-msg"></div>
      </div>

      <!-- content -->
      <div id="content" hidden>
        <div class="filters" id="filters">
          <button class="filterbtn active" data-f="all">전체</button>
          <button class="filterbtn" data-f="private">운영진에게만</button>
          <button class="filterbtn" data-f="public">공개</button>
        </div>
        <div class="toolbar">
          <span class="counts" id="counts"></span>
          <button class="ghostbtn" id="refresh">새로고침</button>
        </div>
        <div class="rule"></div>
        <div id="list"></div>
      </div>
    </div>
  </section>
</div>

<script type="module">
/* Must match preview.html. */
const API_BASE = 'https://summercamp-review.junghyun611.workers.dev';

const PW_KEY = 'summercamp-admin-pw';
const CONFIGURED = !!API_BASE;
const api = API_BASE.replace(/\/$/, '');

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function normalise(v){
  const images = (Array.isArray(v.images) ? v.images : []).filter(im => im && (im.url || im.key));
  return {
    id: v.id, name: v.name || '', message: v.message || '',
    images, isPublic: v.isPublic !== false, createdAt: v.createdAt
  };
}

function when(ms){
  return new Date(ms).toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

/* ---------------- render ---------------- */
let posts = [], filter = 'all';

function render(){
  const rows = posts.filter(p => filter === 'all' ? true : filter === 'private' ? !p.isPublic : p.isPublic);
  const priv = posts.filter(p => !p.isPublic).length;
  $('counts').textContent = `전체 ${posts.length}개 · 운영진에게만 ${priv}개`;

  $('list').innerHTML = rows.length ? rows.map((p, i) => `
    ${i ? '<div class="rule"></div>' : ''}
    <div class="post">
      ${p.images.length ? `<div class="shots${p.images.length > 1 ? ' multi' : ''}">${
        p.images.map(im => `
          <div class="shot">
            <a href="${esc(im.url)}" target="_blank" rel="noopener">
              ${im.type === 'video'
                ? (im.posterUrl
                    ? `<video src="${esc(im.url)}" poster="${esc(im.posterUrl)}" controls playsinline preload="none"></video>`
                    : `<video src="${esc(im.url)}#t=0.1" controls playsinline preload="metadata"></video>`)
                : `<img src="${esc(im.url)}" alt="" loading="lazy">`}
            </a>
            ${im.origUrl ? `<a class="origlink" href="${esc(im.origUrl)}" download target="_blank" rel="noopener">원본 내려받기 ↓</a>` : ''}
          </div>`).join('')
      }</div>` : ''}
      ${p.message ? `<div class="body">${esc(p.message)}</div>` : ''}
      <div class="meta">
        <span class="who">${esc(p.name || '익명')}</span>
        <span class="when">${esc(when(p.createdAt))}</span>
        ${p.isPublic ? '<span class="badge">공개</span>' : '<span class="badge priv">운영진에게만</span>'}
        <button class="delbtn" data-id="${esc(p.id)}">삭제</button>
      </div>
    </div>`).join('') : `<div class="empty">해당하는 후기가 없습니다.</div>`;

  $('list').querySelectorAll('.delbtn').forEach(b => { b.onclick = () => remove(b.dataset.id); });
}

document.querySelectorAll('.filterbtn').forEach(b => {
  b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll('.filterbtn').forEach(x => x.classList.toggle('active', x === b));
    render();
  };
});

/* ---------------- demo mode ---------------- */
/* Without a Worker there is nothing to authenticate against, so the page
   reads whatever preview.html left in this browser. It shows the layout
   and the public/private split without standing in for real access
   control — that lives in the Worker. */
if (!CONFIGURED){
  $('banner').textContent = '데모 모드 — 서버 연결 전이라 이 브라우저에 저장된 후기만 보여줍니다. 비밀번호 잠금은 연결 후 동작합니다.';
  $('banner').hidden = false;
  $('content').hidden = false;
  try { posts = (JSON.parse(localStorage.getItem('summercamp-reviews-demo')) || []).map(normalise); }
  catch(e){ posts = []; }
  posts.sort((a,b) => b.createdAt - a.createdAt);
  render();

  $('refresh').onclick = () => location.reload();
  window.remove = id => {
    if (!confirm('이 후기를 삭제할까요?')) return;
    const all = (JSON.parse(localStorage.getItem('summercamp-reviews-demo')) || []).filter(p => String(p.id) !== String(id));
    localStorage.setItem('summercamp-reviews-demo', JSON.stringify(all));
    location.reload();
  };
} else {
  /* ---------------- worker ---------------- */
  let pw = sessionStorage.getItem(PW_KEY) || '';

  async function callAdmin(path, options = {}){
    const res = await fetch(`${api}${path}`, {
      ...options,
      headers: {...(options.headers || {}), 'X-Admin-Password': pw}
    });
    if (res.status === 401) throw new Error('unauthorized');
    if (!res.ok) throw new Error(`${path} ${res.status}`);
    return res.json();
  }

  async function load(){
    const {items} = await callAdmin('/admin/posts');
    posts = (items || []).map(normalise);
    render();
  }

  window.remove = async id => {
    if (!confirm('이 후기를 삭제할까요? 사진도 함께 지워집니다.')) return;
    try {
      await callAdmin('/admin/delete', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({id})
      });
      posts = posts.filter(p => p.id !== id);
      render();
    } catch (e){
      console.error(e);
      alert('삭제하지 못했습니다.');
    }
  };

  function lock(msg){
    pw = '';
    sessionStorage.removeItem(PW_KEY);
    $('gate').hidden = false;
    $('content').hidden = true;
    $('signout').hidden = true;
    $('gate-msg').textContent = msg || '';
  }

  async function unlock(candidate){
    pw = candidate;
    try {
      await load();
      sessionStorage.setItem(PW_KEY, candidate);
      $('gate').hidden = true;
      $('content').hidden = false;
      $('signout').hidden = false;
      $('gate-msg').textContent = '';
    } catch (e){
      if (e.message === 'unauthorized') lock('비밀번호가 맞지 않습니다.');
      else { console.error(e); lock('불러오지 못했습니다. 잠시 후 다시 시도해주세요.'); }
    }
  }

  $('pwform').onsubmit = e => {
    e.preventDefault();
    const v = $('pw').value;
    if (!v) return;
    $('pwgo').disabled = true;
    unlock(v).finally(() => { $('pwgo').disabled = false; $('pw').value = ''; });
  };
  $('signout').onclick = () => lock('');
  $('refresh').onclick = () => load().catch(e => {
    if (e.message === 'unauthorized') lock('다시 로그인해주세요.');
  });

  /* Remembered for the tab only, so closing it locks the page again. */
  if (pw) unlock(pw); else lock('');
}
</script>
</body>
</html>
